  <text x="400" y="34" font-size="12" text-anchor="end" fill="#6b655c">Cart · 2</text>

  <text x="20" y="96" font-size="20" font-weight="600" fill="#14110e">Checkout</text>
  <text x="20" y="120" font-size="12" fill="#6b655c">18 Example Street, Sample City</text>

  <rect x="20" y="144" width="380" height="92" rx="12" fill="#ffffff" stroke="#e6e1d8"/>
