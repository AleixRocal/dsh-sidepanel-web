<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>sidepanel-web preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e13; overflow: hidden; }
  body { display: flex; justify-content: center; align-items: stretch; }
  #side {
    background: #0b0e13; border-left: 1px solid #21262d;
    display: flex; flex-direction: column; overflow: hidden;
  }
  /* 模拟宿主 tab 条，只为让截图有上下文 */
  #strip {
    flex: none; height: 30px; display: flex; align-items: center; gap: 6px;
    padding: 0 10px; background: #0d1117; border-bottom: 1px solid #21262d;
    color: #8b949e; font: 11px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  }
  #strip i { width: 6px; height: 6px; border-radius: 50%; background: #30363d; display: inline-block; }
  /* 关键：宿主 cells 给高度（flex:1 + min-height:0），这正是 DSH 侧栏的行为 */
  #mount { flex: 1; min-height: 0; display: block; }
</style>
</head>
<body>
<div id="side">
  <div id="strip"><i></i>Browser<span style="margin-left:auto;color:#484f58">preview</span></div>
  <div id="mount"></div>
</div>

<script src="/vendor/react.js"></script>
<script src="/vendor/react-dom.js"></script>
<script>
(async function () {
  const q = new URLSearchParams(location.search);
  const state = q.get("state") || "ready";
  const w = Number(q.get("w") || 360);
  const h = Number(q.get("h") || 780);
  // Annotation text used by ?state=picked / typing / insert. Screenshots pass
  // their own so the preview and the marketing mockups stay in sync.
  const note = q.get("note") || "Make the primary action sticky on mobile";
  // `?chrome=0` hides the fake host strip so the panel can be embedded in the
  // full-window mockup (tools/mockups).
  const showChrome = q.get("chrome") !== "0";
  // ?url=… simulates a chat link: it arrives as sidebar navigation params.url
  const requestedUrl = q.get("url") || "";
  // ?force-native=1 simulates choosing "Force native view" for that origin.
  // The client reads the carrier preference from localStorage on mount, so it
  // has to be written before the panel renders.
  if (q.get("force-native") === "1" && requestedUrl) {
    try {
      localStorage.setItem("sidepanel-web:carrier:" + new URL(requestedUrl).origin, "native");
    } catch (e) { console.warn(e); }
  }
  // The menu state starts from the default carrier, so a preference left by an
  // earlier run must not short-circuit it.
  if (state === "force-native-menu" && requestedUrl) {
    try {
      localStorage.removeItem("sidepanel-web:carrier:" + new URL(requestedUrl).origin);
    } catch (e) { console.warn(e); }
  }
  const side = document.getElementById("side");
  side.style.width = w + "px";
  side.style.height = h + "px";
  if (!showChrome) {
    document.getElementById("strip").style.display = "none";
    side.style.borderLeft = "0";
    document.body.style.background = "transparent";
  }

  await fetch("/__state?value=" + encodeURIComponent(state));

  const React = window.React;
  const ReactDOM = window.ReactDOM;
  const mount = document.getElementById("mount");

  let mod = null;
  window.__ModuleLoader__ = {
    load(entry) {
      mod = entry.factory((name) => (name === "react" ? React : {}));
    }
  };

  // 装 client.js
  await new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "/client.js";
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });

  let tabDef = null;
  let bodyComp = null;
  let writerComp = null;
  // The client registers { en, es } with ctx.locale; this harness used to
  // return the raw key, which made every preview render in the source
  // language (Chinese). Resolve through the registered dictionary instead, so
  // the preview matches what a real DSH profile shows.
  let localeDict = null;
  const lang = new URLSearchParams(location.search).get("lang") || "en";
  const ctx = {
    logger: console,
    effect(fn) { const out = fn(); return typeof out === "function" ? out : () => {}; },
    locale: {
      register(id, dict) { localeDict = dict || {}; return () => {}; },
      bind() {
        return (s) => {
          const table = (localeDict && (localeDict[lang] || localeDict.en)) || {};
          return table[s] || ((localeDict && localeDict.en && localeDict.en[s]) || s);
        };
      }
    },
    slots: {
      inject(name, fn) { return fn(); },
      register(desc, comp) {
        if (desc && desc.name === "conversation.input.dock") writerComp = comp;
        if (desc && desc.name === "sidebar.right.pane.tab") bodyComp = comp;
        return desc;
      }
    },
    sidebarRightTabs: {
      register(def) { tabDef = def; return () => {}; }
    },
    inject(deps, cb) {
      // No pasteChip in the harness. `conversation` is faked so the crop
      // attachment path can be exercised end-to-end: createDrafts records the
      // File objects and returns draft ids for addAttachments.
      const conversation = {
        createDrafts(sessionId, files) {
          window.__draftFiles = files.map((f) => ({ name: f.name, type: f.type, size: f.size }));
          return files.map((file, i) => ({ id: "fake-draft-" + i, kind: "image", file }));
        }
      };
      try {
        cb({ pasteChip: null, conversation, get: (name) => (name === "conversation" ? conversation : null) });
      } catch (e) { console.warn(e); }
    }
  };
  mod.apply(ctx);
  if (!tabDef) throw new Error("没有注册 tab type");
  if (!bodyComp) throw new Error("没有注册 tab body");

  const useTabInfo = () => ({
    sidebar: { expanded: true, fullscreen: false },
    panel: { id: "pane" },
    tab: {
      id: "preview-tab",
      kind: tabDef.kind,
      visible: true,
      fullscreen: false,
      navigation: {
        address: "preview",
        params: requestedUrl ? { url: requestedUrl } : {},
        revision: requestedUrl ? 1 : 0
      },
      signal: new AbortController().signal,
      actions: { openTab() {}, bindCommands() {} }
    }
  });

  ReactDOM.createRoot(mount).render(
    React.createElement(bodyComp, { visible: true, useTabInfo })
  );

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const waitFor = async (sel, timeout = 8000) => {
    const t0 = Date.now();
    while (Date.now() - t0 < timeout) {
      const el = document.querySelector(sel);
      if (el && el.getBoundingClientRect().width > 0) return el;
      await sleep(60);
    }
    return null;
  };


  if (state === "esc-native") {
    // Native carrier: the page lives in a same-origin iframe, so Esc has to be
    // caught by the injected overlay and forwarded as a cancel message.
    await waitFor(".ab2-root");
    await sleep(600);
    const findToggle = () => [...document.querySelectorAll(".ab2-btn")].find((b) => /Annotate|Exit annotate|标注/i.test(b.textContent));
    const toggle = findToggle();
    if (toggle) { toggle.click(); await sleep(600); }
    const before = findToggle() ? findToggle().className.indexOf(" on") >= 0 : null;
    const frame = document.querySelector("iframe.ab2-frame");
    try {
      if (frame && frame.contentDocument) {
        frame.contentDocument.body.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
      }
    } catch (e) { window.__escNativeError = String(e); }
    await sleep(500);
    const after = findToggle() ? findToggle().className.indexOf(" on") >= 0 : null;
    window.__escNative = { before, after, error: window.__escNativeError || null };
  }

  if (state === "insert-native") {
    // Native carrier, full Insert path: pick an element inside the proxied
    // iframe, note it, add it to the list, and attach the one composite image.
    const writerHost = document.createElement("div");
    writerHost.id = "writer-host";
    document.body.appendChild(writerHost);
    window.__draft = null;
    ReactDOM.createRoot(writerHost).render(
      React.createElement(writerComp, {
        sessionId: "preview-session",
        inputActions: {
          setDraft: (v) => { window.__draft = v; },
          addAttachments: (ids) => { window.__attached = (window.__attached || []).concat(ids); }
        },
        useInput: () => ({ draft: "" })
      })
    );
    await sleep(100);
    await waitFor(".ab2-root");
    await sleep(600);
    const annotate = [...document.querySelectorAll(".ab2-btn")].find((b) => /Annotate/i.test(b.textContent));
    if (annotate) { annotate.click(); await sleep(500); }
    const frame = document.querySelector("iframe.ab2-frame");
    let picked = false;
    try {
      const btn = frame && frame.contentDocument && frame.contentDocument.querySelector("#cta");
      if (btn) {
        const r = btn.getBoundingClientRect();
        btn.dispatchEvent(new MouseEvent("click", {
          bubbles: true, cancelable: true,
          clientX: r.left + r.width / 2, clientY: r.top + r.height / 2
        }));
        picked = true;
      }
    } catch (e) { window.__insertNativeError = String(e); }
    const card = await waitFor(".ab2-note");
    if (card) {
      const ta = card.querySelector("textarea");
      if (ta) {
        const setter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, "value").set;
        setter.call(ta, "Make the primary action sticky on mobile");
        ta.dispatchEvent(new Event("input", { bubbles: true }));
        await sleep(120);
      }
      const add = [...card.querySelectorAll("button")].find((b) => /Add to list|加入列表/i.test(b.textContent));
      if (add) { add.click(); await sleep(1200); }
    }
    const insert = [...document.querySelectorAll(".ab2-btn")].find((b) => /^Insert/.test(b.textContent.trim()));
    if (insert && !insert.disabled) { insert.click(); await sleep(1500); }
    window.__insertNative = {
      picked,
      error: window.__insertNativeError || null,
      draft: window.__draft,
      files: window.__draftFiles || [],
      attached: window.__attached || []
    };
  }

  if (state === "insert") {
    // 先把隐藏写入器挂上（真实宿主里它在 conversation.input.dock 槽位）
    const writerHost = document.createElement("div");
    writerHost.id = "writer-host";
    document.body.appendChild(writerHost);
    window.__draft = null;
    ReactDOM.createRoot(writerHost).render(
      React.createElement(writerComp, {
        sessionId: "preview-session",
        inputActions: {
          setDraft: (v) => { window.__draft = v; },
          addAttachments: (ids) => { window.__attached = (window.__attached || []).concat(ids); }
        },
        useInput: () => ({ draft: "Make the checkout button stand out" })
      })
    );
    await sleep(100);

    const toggle = await waitFor(".ab-toggle:not([disabled])");
    if (toggle) { toggle.click(); await sleep(150); }
    const frame = await waitFor(".ab-frame");
    if (frame) {
      const r = frame.getBoundingClientRect();
      frame.dispatchEvent(new MouseEvent("click", { bubbles: true, clientX: r.left + r.width * 0.344, clientY: r.top + r.height * 0.399 }));
      const card = await waitFor(".ab-card");
      if (card) {
        const input = card.querySelector(".ab-note");
        const setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, "value").set;
        setter.call(input, note);
        input.dispatchEvent(new Event("input", { bubbles: true }));
        await sleep(120);
        const btn = [...card.querySelectorAll(".ab-btn")].find((b) => /Insert|插入/i.test(b.textContent));
        if (btn) btn.click();
        await sleep(500);
      }
    }
    window.__insert = {
      draft: window.__draft,
      cardGone: !document.querySelector(".ab-card"),
      toast: (document.querySelector(".ab-toast") || {}).textContent || null,
      count: (document.querySelector(".ab-count") || {}).textContent || null,
      attached: window.__attached || [],
      draftFiles: window.__draftFiles || []
    };
  }

  if (state === "esc") {
    // Esc must leave annotate mode even when focus is not on the panel root.
    const toggle = await waitFor(".ab-toggle:not([disabled])");
    if (toggle) {
      toggle.click();
      await sleep(200);
    }
    const before = (document.querySelector(".ab-toggle") || {}).getAttribute
      ? document.querySelector(".ab-toggle").getAttribute("aria-pressed")
      : null;
    window.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
    await sleep(250);
    const afterEl = document.querySelector(".ab-toggle");
    window.__esc = { before, after: afterEl ? afterEl.getAttribute("aria-pressed") : null };
  }

  if (state === "tall") { /* 只取图，不点选 */ }

  if (state === "picked" || state === "typing" || state === "shoterr" || state === "tallpicked") {
    // 先开标注模式（真实用户路径：点开关 → 点画面）
    const toggle = await waitFor(".ab-toggle:not([disabled])");
    if (toggle) {
      toggle.click();
      await sleep(150);
    }
    const frame = await waitFor(".ab-frame");
    if (frame) {
      const r = frame.getBoundingClientRect();
      // Click the centre of the "Place order" button in fixture-page.svg
      // (x 152–728, y 536–580 of 1280×1400), so the pin lands on the CTA.
      const cx = r.left + r.width * 0.344;
      const cy = r.top + r.height * 0.399;
      frame.dispatchEvent(new MouseEvent("click", { bubbles: true, clientX: cx, clientY: cy }));
      const card = await waitFor(".ab-card");
      if (state === "typing" && card) {
        const input = card.querySelector(".ab-note");
        input.focus();
        const setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, "value").set;
        setter.call(input, note);
        input.dispatchEvent(new Event("input", { bubbles: true }));
        await sleep(120);
      }
      if (state === "shoterr") {
        // 等一轮轮询失败，制造红条
        await sleep(2600);
      }
    }
  }

  if (state === "device") {
    // Apply the phone preset, then reopen the ⋯ menu so the screenshot shows
    // both the emulated page and the preset list.
    await waitFor(".ab-root");
    await sleep(300);
    const more = [...document.querySelectorAll("button")].find((b) => b.textContent.trim() === "⋯");
    if (more) {
      more.click();
      await sleep(220);
      const phone = [...document.querySelectorAll("button")].find((b) => /Phone 390/.test(b.textContent));
      if (phone) {
        phone.click();
        await sleep(1100);
      }
      more.click();
      await sleep(260);
    }
    window.__device = { found: !!more, preset: (document.querySelector(".ab-mode") || {}).textContent || "" };
  }

  if (state === "force-native") {
    // Public URL plus a saved "native" preference: the forced proxy carrier
    // must mount, carry the f. token and show the same-origin warning.
    await waitFor(".ab2-root");
    await sleep(700);
    const frame = document.querySelector("iframe.ab2-frame");
    const warn = document.querySelector(".ab2-warn");
    window.__forceNative = {
      root: !!document.querySelector(".ab2-root"),
      frame: !!frame,
      warn: !!warn,
      warnText: warn ? warn.textContent : "",
      src: frame ? frame.getAttribute("src") : ""
    };
  }

  if (state === "force-native-menu") {
    // Same result, but through the UI: open ⋯ on a public page and click the
    // Force native view item; that is the path a user actually takes.
    await waitFor(".ab-root");
    await sleep(400);
    const more = [...document.querySelectorAll("button")].find((b) => b.textContent.trim() === "⋯");
    if (more) {
      more.click();
      await sleep(250);
    }
    const force = [...document.querySelectorAll("button")].find((b) => /Force native view/.test(b.textContent));
    if (force) {
      force.click();
      await sleep(1400);
    }
    const frame = document.querySelector("iframe.ab2-frame");
    const warn = document.querySelector(".ab2-warn");
    window.__forceNative = {
      root: !!document.querySelector(".ab2-root"),
      frame: !!frame,
      warn: !!warn,
      warnText: warn ? warn.textContent : "",
      src: frame ? frame.getAttribute("src") : "",
      found: !!force
    };
  }

  await sleep(300);
  // 记录几何信息，便于机器校验（不是给人看的）
  const root = document.querySelector(".ab-root");
  const stage = document.querySelector(".ab-stage");
  const fr = document.querySelector(".ab-frame");
  const frameImg = fr && fr.querySelector("img");
  window.__metrics = {
    state,
    w, h,
    root: root && root.getBoundingClientRect().toJSON(),
    stage: stage && stage.getBoundingClientRect().toJSON(),
    frame: fr && fr.getBoundingClientRect().toJSON(),
    natural: frameImg ? [frameImg.naturalWidth, frameImg.naturalHeight] : null,
    overflow: stage ? { sw: stage.scrollWidth, cw: stage.clientWidth, sh: stage.scrollHeight, ch: stage.clientHeight } : null,
    docScroll: { sw: document.documentElement.scrollWidth, sh: document.documentElement.scrollHeight },
    esc: window.__esc || null,
    escNative: window.__escNative || null
  };
  document.body.setAttribute("data-ready", "1");
  window.__ready = true;
})();
</script>
</body>
</html>
