<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>dsh-sidepanel-web · banner</title>
<!--
  Repository banner mockup. No real session, account or page data: the window
  on the right is a wireframe, not a screenshot of the live GUI.
  Rendered by test/preview/mockups.mjs -> assets/banner.png (1600×420 at 2×).
-->
<style>
  :root {
    --bg: #0b1220;
    --bg2: #111c33;
    --text: #f4f7fb;
    --muted: #9fb0c8;
    --line: #ffffff1c;
    --blue: #60a5fa;
    --green: #3fb950;
    --font: "Inter", "Liberation Sans", "DejaVu Sans", system-ui, sans-serif;
    --mono: "MesloLGS NF", "Liberation Mono", "DejaVu Sans Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1600px; height: 420px; overflow: hidden; }
  body {
    font: 16px/1.5 var(--font);
    color: var(--text);
    background:
      radial-gradient(900px 420px at 8% -30%, #1d3b78 0%, transparent 60%),
      radial-gradient(700px 380px at 96% 110%, #0e3a2b 0%, transparent 58%),
      linear-gradient(110deg, var(--bg), var(--bg2));
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center;
  }
  .grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(#ffffff10 1px, transparent 1px);
    background-size: 26px 26px;
    mask-image: linear-gradient(90deg, #000 0%, transparent 70%);
  }
  .wrap {
    position: relative; z-index: 1;
    display: flex; align-items: center; gap: 34px;
    width: 100%; padding: 0 72px;
  }
  .mark {
    width: 118px; height: 118px; flex: none; border-radius: 28px;
    background: linear-gradient(135deg, #132a55, #060b15);
    border: 1px solid #ffffff24;
    box-shadow: 0 24px 60px #0008, inset 0 1px 0 #ffffff14;
    display: grid; place-items: center;
  }
  .text { flex: 1; min-width: 0; }
  .eyebrow {
    font-size: 12px; letter-spacing: 2.4px; text-transform: uppercase;
    color: #8fb4e8; font-weight: 600; margin-bottom: 8px;
  }
  h1 {
    margin: 0 0 8px; font-size: 52px; line-height: 1.05;
    letter-spacing: -1.4px; font-weight: 650;
  }
  h1 span { color: #8fb4e8; }
  .tagline { margin: 0 0 18px; font-size: 19px; color: var(--muted); max-width: 820px; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    border: 1px solid var(--line); background: #ffffff08;
    border-radius: 999px; padding: 5px 12px;
    font-size: 12px; color: #c9d6e8;
  }
  .pill b { color: #eaf2ff; font-weight: 600; }
  .pill.blue { border-color: #60a5fa44; background: #60a5fa12; color: #cfe0ff; }
  .pill.green { border-color: #3fb95044; background: #3fb95012; color: #b7f0c0; }

  .wire {
    width: 470px; flex: none; height: 300px;
    border: 1px solid #ffffff22; border-radius: 18px;
    background: linear-gradient(180deg, #151b29, #0d1320);
    box-shadow: 0 30px 70px #0009;
    overflow: hidden; position: relative;
    transform: rotate(-1.2deg);
  }
  .wire .bar {
    height: 36px; display: flex; align-items: center; gap: 6px;
    padding: 0 12px; border-bottom: 1px solid #ffffff14; background: #ffffff06;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #ffffff2e; }
  .url {
    margin-left: 8px; flex: 1; height: 18px; border-radius: 5px;
    background: #ffffff0d; border: 1px solid #ffffff12;
    font: 10px var(--mono); color: #9fb0c8; display: flex; align-items: center; padding: 0 8px;
  }
  .stage { padding: 16px; display: flex; gap: 14px; }
  .card {
    flex: 1; border-radius: 10px; background: #f6f4ef; height: 218px;
    padding: 14px; color: #14110e; position: relative;
  }
  .card .h { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .card .row { height: 9px; border-radius: 4px; background: #e6e1d8; margin: 7px 0; }
  .card .row.w1 { width: 78%; } .card .row.w2 { width: 55%; }
  .card .cta {
    position: absolute; left: 14px; right: 14px; bottom: 14px; height: 30px;
    border-radius: 7px; background: #1f3d33; color: #f6f4ef;
    display: grid; place-items: center; font-size: 10.5px; font-weight: 600;
  }
  .side { width: 128px; display: flex; flex-direction: column; gap: 10px; }
  .side .box { height: 64px; border-radius: 10px; background: #ffffff0a; border: 1px solid #ffffff12; }
  .pin {
    position: absolute; width: 34px; height: 34px; border-radius: 50% 50% 50% 4px;
    background: linear-gradient(135deg, #60a5fa, #2563eb);
    border: 2px solid #0d1320; transform: rotate(-45deg);
    right: 158px; top: 228px; box-shadow: 0 8px 20px #0007;
    display: grid; place-items: center;
  }
  .pin i {
    width: 11px; height: 11px; border-radius: 50%; background: #fff;
    transform: rotate(45deg); display: block;
  }
  .note {
    position: absolute; right: 12px; top: 176px;
    background: #1b2435; border: 1px solid #60a5fa55;
    border-left: 3px solid var(--blue); border-radius: 8px;
    padding: 8px 10px; width: 152px; box-shadow: 0 16px 40px #0008;
    font-size: 10px; color: #dce8fa;
  }
  .note b { display: block; font: 9px var(--mono); color: #8fb4e8; margin-bottom: 3px; letter-spacing: .4px; }
  .glow { position: absolute; right: -80px; top: -120px; width: 520px; height: 520px; background: #60a5fa1a; filter: blur(90px); border-radius: 50%; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="wrap">
    <div class="mark" aria-hidden="true">
      <svg width="76" height="76" viewBox="0 0 512 512" fill="none">
        <rect x="52" y="88" width="408" height="308" rx="34" fill="#0B1220" stroke="#E2E8F0" stroke-width="20"/>
        <path d="M52 168H460" stroke="#E2E8F0" stroke-width="20"/>
        <circle cx="104" cy="128" r="9" fill="#E2E8F0"/>
        <circle cx="138" cy="128" r="9" fill="#94A3B8"/>
        <circle cx="172" cy="128" r="9" fill="#475569"/>
        <rect x="96" y="208" width="150" height="16" rx="8" fill="#334155"/>
        <rect x="96" y="242" width="210" height="12" rx="6" fill="#1E293B"/>
        <rect x="96" y="270" width="180" height="12" rx="6" fill="#1E293B"/>
        <path d="M368 228c-47 0-82 34-82 77 0 58 82 129 82 129s82-71 82-129c0-43-35-77-82-77Z" fill="#2563EB" stroke="#0B1220" stroke-width="12"/>
        <circle cx="368" cy="303" r="25" fill="#FFFFFF"/>
      </svg>
    </div>
    <div class="text">
      <div class="eyebrow">DeepSeek Harness · Web plugin</div>
      <h1>dsh-sidepanel<span>-web</span></h1>
      <p class="tagline">A browser in the DSH right sidebar — with element picks that reach the chat.</p>
      <div class="pills">
        <span class="pill blue"><b>CDP</b> for any site</span>
        <span class="pill green"><b>Same-origin</b> proxy for local/dev</span>
        <span class="pill">Device emulation</span>
        <span class="pill"><b>MIT</b></span>
      </div>
    </div>
    <div class="wire" aria-hidden="true">
      <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><div class="url">example.com/checkout</div></div>
      <div class="stage">
        <div class="card">
          <div class="h">Checkout</div>
          <div class="row w1"></div><div class="row w2"></div><div class="row w1"></div>
          <div class="cta">Place order</div>
        </div>
        <div class="side"><div class="box"></div><div class="box"></div><div class="box"></div></div>
      </div>
      <div class="pin"><i></i></div>
      <div class="note"><b>ANNOTATION 01</b>Make the primary action sticky on mobile.</div>
    </div>
  </div>
  <script>document.body.setAttribute("data-ready", "1");</script>
</body>
</html>
